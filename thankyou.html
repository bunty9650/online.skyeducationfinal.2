<body id="thankyouPage">
<main>
	<div class="thankyou-wrap">
		<section class="thankyou-card">
			<div id="thanksImg"><img src="images/icon-tick.webp" alt="Lead Form Submitted"></div>
			<div class="thankyou-eyebrow">Enquiry Received</div>
			<h1>Thank You, <span class="brandGreen" id="thankName">Student</span>!</h1>
			<p class="thankyou-copy">
				Your request has been submitted successfully. Our counselor will connect with you shortly to guide you about
				<span class="brandGreen" id="thankCourse">your selected course</span>.
			</p>
			<div class="thankyou-actions">
				<a class="thankyou-btn primary" href="index.html">Back to Home</a>
				<a class="thankyou-btn secondary" href="https://api.whatsapp.com/send?phone=919873042303&text=I%20have%20query%20about%20degree%20program%2C" target="_blank" rel="noreferrer">Chat on WhatsApp</a>
			</div>
		</section>
	</div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get("name");
  const course = params.get("course");

  if (name) {
    document.getElementById("thankName").textContent = name;
  }
  if (course) {
    document.getElementById("thankCourse").textContent = course;
  }
</script>
